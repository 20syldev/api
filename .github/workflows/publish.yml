name: 20syldev/api package publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Node 22 ships npm 10.x, trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11
      - run: npm --version

      - run: npm ci

      # Guard against publishing a tag that does not match package.json
      - run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "Refusing to publish from $GITHUB_REF; run this on a tag."; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "Tag $tag != package.json $pkg"; exit 1; }

      - run: npm stage publish --provenance
